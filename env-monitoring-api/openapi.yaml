openapi: 3.1.0
info:
  title: Environmental IoT Monitoring API
  version: 1.0.0
  description: REST API contract for managing IoT devices and their environmental measurements.

servers:
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Devices
    description: Operations for managing IoT devices.
  - name: Measurements
    description: Operations for managing environmental measurements reported by devices.

paths:
  /devices:
    get:
      summary: List devices
      description: Retrieves all registered IoT devices.
      operationId: listDevices
      tags:
        - Devices
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'

    post:
      summary: Create device
      description: Creates a new IoT device with its name and location.
      operationId: createDevice
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'

  /devices/{deviceId}:
    get:
      summary: Get device by ID
      description: Retrieves a single IoT device by its identifier.
      operationId: getDevice
      tags:
        - Devices
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete device
      description: Deletes a specific IoT device by its identifier.
      operationId: deleteDevice
      tags:
        - Devices
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Device deleted successfully
          content: {}
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}/status:
    get:
      summary: Get device status
      description: Retrieves the current status of a specific IoT device.
      operationId: getDeviceStatus
      tags:
        - Devices
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device status found
          content:
            application/json:
              schema:
                type: object
                required:
                  - deviceId
                  - status
                properties:
                  deviceId:
                    type: integer
                  status:
                    type: string
                    enum:
                      - online
                      - offline
                      - maintenance
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}/measurements:
    get:
      summary: List measurements for a device
      description: Retrieves all environmental measurements reported by a specific device.
      operationId: listDeviceMeasurements
      tags:
        - Measurements
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: List of measurements for the device
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create measurement for a device
      description: Creates a new temperature and humidity measurement for a specific device.
      operationId: createDeviceMeasurement
      tags:
        - Measurements
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeasurementRequest'
      responses:
        '201':
          description: Measurement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}/measurements/{measurementId}:
    delete:
      summary: Delete a measurement from a device
      description: Deletes a specific measurement associated with a specific device.
      operationId: deleteDeviceMeasurement
      tags:
        - Measurements
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/MeasurementId'
      responses:
        '204':
          description: Measurement deleted successfully
          content: {}
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Device identifier
      schema:
        type: integer

    MeasurementId:
      name: measurementId
      in: path
      required: true
      description: Measurement identifier
      schema:
        type: integer

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Device:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - location
        - created_at
        - status
      properties:
        id:
          type: integer
          description: Unique device identifier
          examples:
            - 1
        name:
          type: string
          minLength: 1
          description: Human-readable device name
          examples:
            - Room 1 Sensor
        location:
          type: string
          minLength: 1
          description: Physical location of the device
          examples:
            - Laboratory Room 1
        created_at:
          type: string
          format: date-time
          description: Device creation timestamp
          examples:
            - '2026-05-19T15:30:00Z'
        status:
          type: string
          description: Current device status
          enum:
            - online
            - offline
            - maintenance
          examples:
            - online

    CreateDeviceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - location
      properties:
        name:
          type: string
          minLength: 1
          examples:
            - Room 1 Sensor
        location:
          type: string
          minLength: 1
          examples:
            - Laboratory Room 1

    Measurement:
      type: object
      additionalProperties: false
      required:
        - id
        - temperature
        - humidity
        - timestamp
        - device_id
      properties:
        id:
          type: integer
          description: Unique measurement identifier
          examples:
            - 2
        temperature:
          type: number
          format: float
          description: Temperature value in Celsius
          examples:
            - 23.5
        humidity:
          type: number
          format: float
          description: Relative humidity percentage
          minimum: 0
          maximum: 100
          examples:
            - 58.2
        timestamp:
          type: string
          format: date-time
          description: Measurement timestamp in ISO 8601 format
          examples:
            - '2026-05-19T15:30:00Z'
        device_id:
          type: integer
          description: Identifier of the device that produced the measurement
          examples:
            - 1

    CreateMeasurementRequest:
      type: object
      additionalProperties: false
      required:
        - temperature
        - humidity
        - timestamp
      properties:
        temperature:
          type: number
          format: float
          description: Temperature value in Celsius
          examples:
            - 23.5
        humidity:
          type: number
          format: float
          description: Relative humidity percentage
          minimum: 0
          maximum: 100
          examples:
            - 58.2
        timestamp:
          type: string
          format: date-time
          description: Measurement timestamp in ISO 8601 format
          examples:
            - '2026-05-19T15:30:00Z'

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
          examples:
            - 400
        error:
          type: string
          description: Machine-readable error code
          examples:
            - bad_request
        message:
          type: string
          description: Human-readable error message
          examples:
            - Invalid request payload
